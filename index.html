<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NAV-PRO V160 - AMALFI JET</title>
    <style>
        :root { --bg: #000; --card: #1c1c1e; --txt: #fff; --cyan: #5ac8fa; --apple-blue: #007aff; --lime: #4cd964; --red: #ff3b30; --gold: #ffcc00; --orange: #ff9500; --purple: #af52de; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--txt); height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: fixed; width: 100%; }
        .header { background: #000; padding: 10px 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; height: 65px; flex-shrink: 0; }
        .boat-box { background: #1c1c1e; padding: 8px 10px; border-radius: 10px; border: 1px solid #333; color: var(--cyan); font-weight: bold; font-size: 12px; border-left: 3px solid var(--cyan); }
        .page { display: none; overflow-y: auto; flex-grow: 1; padding-bottom: 100px; width: 100%; }
        .active-page { display: block; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 15px; }
        .product-btn { background: var(--card); height: 100px; border-radius: 14px; display: flex; align-items: center; padding: 12px; border: 1px solid #333; color: white; }
        .product-btn i { font-size: 24px; margin-right: 12px; font-style: normal; }
        .stock { font-size: 18px; font-weight: bold; color: var(--cyan); }
        .backup-section { margin: 15px; padding: 15px; background: #1c1c1e; border-radius: 15px; border: 1px dashed #444; text-align: center; }
        .btn-big { width: 100%; padding: 18px; border-radius: 15px; font-weight: bold; font-size: 16px; margin-top: 12px; border: none; cursor: pointer; }
        .footer { position: fixed; bottom: 0; width: 100%; background: #0a0a0a; display: flex; height: 75px; border-top: 1px solid #333; z-index: 1000; }
        .footer button { flex: 1; background: none; border: none; color: #888; font-size: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
        .footer button.active { color: var(--cyan); }
        #toast { visibility: hidden; min-width: 200px; background-color: var(--apple-blue); color: #fff; text-align: center; border-radius: 10px; padding: 16px; position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); font-weight: bold; z-index: 5000; }
        #toast.show { visibility: visible; }
    </style>
</head>
<body onload="init()">

<div id="toast">Messaggio</div>

<div class="header">
    <div class="boat-box" id="boat-display">AMALFI JET</div>
    <div style="text-align:center"><small>INCASSO OGGI</small><br><b id="tot-incasso">0.00€</b></div>
</div>

<div id="page-c" class="page active-page"><div class="grid" id="grid-cassa"></div></div>

<div id="page-m" class="page">
    <div class="backup-section">
        <button onclick="exportJSON()" style="background:var(--lime); color:black;" class="btn-big">💾 SALVA BACKUP (JSON)</button>
        <button onclick="document.getElementById('file-input').click()" style="background:var(--orange); color:black;" class="btn-big">📂 CARICA BACKUP (JSON)</button>
        <input type="file" id="file-input" style="display:none" accept=".json" onchange="importJSON(event)">
    </div>
</div>

<div class="footer">
    <button id="t-c" class="active" onclick="switchTab('c')">🛒 CASSA</button>
    <button id="t-m" onclick="switchTab('m')">📊 DATI</button>
</div>

<script>
let db = {
    prodotti: [
        {n:"ACQUA", i:"💧", pas:2.0, pen:1.0, q: 229, vePas:0, vePen:0, c:0},
        {n:"ARACHIDI", i:"🥜", pas:2.5, pen:1.0, q: 35, vePas:0, vePen:0, c:0},
        {n:"BORSE G", i:"👜", pas:10.0, pen:10.0, q: 4, vePas:0, vePen:0, c:0},
        {n:"BORSE M", i:"🛍️", pas:7.0, pen:7.0, q: 12, vePas:0, vePen:0, c:0},
        {n:"BUENO/BISC", i:"🍫", pas:3.0, pen:1.0, q: 54, vePas:0, vePen:0, c:0},
        {n:"CAPPELLI", i:"🧢", pas:5.0, pen:5.0, q: 60, vePas:0, vePen:0, c:0},
        {n:"CIALDE", i:"☕", pas:2.0, pen:1.0, q: 153, vePas:0, vePen:0, c:0},
        {n:"LATTINE", i:"🥤", pas:2.5, pen:1.5, q: 196, vePas:0, vePen:0, c:0},
        {n:"PERONI", i:"🍺", pas:4.5, pen:1.5, q: 81, vePas:0, vePen:0, c:0},
        {n:"PRINGLES", i:"🥔", pas:3.5, pen:2.0, q: 26, vePas:0, vePen:0, c:0}
    ]
};

function init() {
    const saved = localStorage.getItem('NAV_DATA_AMALFI');
    if(saved) db = JSON.parse(saved);
    render();
}

function showToast(msg) {
    const t = document.getElementById("toast");
    t.innerText = msg; t.className = "show";
    setTimeout(() => { t.className = ""; }, 3000);
}

function render() {
    let inc = 0;
    document.getElementById('grid-cassa').innerHTML = db.prodotti.map((p, i) => {
        const giac = (p.q + p.c) - (p.vePas + p.vePen);
        inc += (p.vePas * p.pas) + (p.vePen * p.pen);
        return `<div class="product-btn" onclick="vendi(${i})"><i>${p.i}</i><div><b>${p.n}</b><br><span class="stock">${giac}</span></div></div>`;
    }).join('');
    document.getElementById('tot-incasso').innerText = inc.toFixed(2) + "€";
    localStorage.setItem('NAV_DATA_AMALFI', JSON.stringify(db));
}

function vendi(i) {
    db.prodotti[i].vePas++;
    render();
}

function switchTab(t) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
    document.getElementById('page-'+t).classList.add('active-page');
    document.querySelectorAll('.footer button').forEach(b => b.classList.remove('active'));
    document.getElementById('t-'+t).classList.add('active');
}

function exportJSON() {
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'BACKUP_AMALFI.json';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    showToast("File salvato nei Download!");
}

function importJSON(event) {
    const reader = new FileReader();
    reader.onload = e => {
        db = JSON.parse(e.target.result);
        render();
        showToast("Dati caricati!");
    };
    reader.readAsText(event.target.files[0]);
}
</script>
</body>
</html>
