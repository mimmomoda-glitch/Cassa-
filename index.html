<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NAV-PRO V62: OMAGGI RECOVERY</title>
    <style>
        :root {
            --bg: #000; --card: #111; --txt: #e2e8f0;
            --cyan: #00f2ff; --lime: #39ff14; --red: #ff003c; 
            --gold: #ffb700; --magenta: #bc13fe; --blue: #0070ff;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; outline: none; }
        body { margin: 0; background: var(--bg); color: var(--txt); padding-top: 245px; }
        header { position: fixed; top: 0; left: 0; width: 100%; background: #000; z-index: 2000; border-bottom: 2px solid var(--cyan); }
        .date-bar { background: #111; color: var(--gold); text-align: center; padding: 6px; font-size: 12px; font-weight: bold; border-bottom: 1px solid #333; }
        .nav-tabs { display: flex; background: #111; }
        .tab-btn { flex: 1; padding: 15px; border: none; background: none; color: #666; font-weight: bold; font-size: 11px; text-transform: uppercase; }
        .tab-btn.active { color: var(--cyan); border-bottom: 3px solid var(--cyan); background: rgba(0,242,255,0.1); }
        .rect-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 8px; }
        .rect { padding: 5px; border-radius: 4px; background: #080808; text-align: center; border: 1px solid #222; }
        .rect b { font-size: 8px; display: block; color: #888; text-transform: uppercase; }
        .rect span { font-size: 11px; font-weight: bold; }
        .page { display: none; padding: 10px; padding-bottom: 100px; }
        .page.active { display: block; }
        .prod-card { background: var(--card); border-radius: 8px; border: 1px solid #222; margin-bottom: 10px; padding: 12px; }
        .input-box { width: 100%; background: #000; border: 1px solid #333; color: #fff; text-align: center; padding: 8px; border-radius: 4px; font-size: 14px; }
        .btn-qty { width: 50px; height: 50px; border-radius: 10px; border: 2px solid; font-size: 24px; font-weight: bold; background: none; color: var(--txt); cursor: pointer; }
        .btn-action { width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; border: none; margin-top: 10px; font-size: 12px; text-transform: uppercase; cursor: pointer; }
        .cal-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 15px; }
        .q-title { color: var(--gold); font-size: 11px; font-weight: bold; margin-bottom: 8px; border-left: 3px solid var(--gold); padding-left: 8px; }
        .q-tot-box { background: #0a0a0a; border: 1px solid #333; padding: 8px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    </style>
</head>
<body onload="inizializza()">

    <header>
        <div class="date-bar" id="current-date">DATA...</div>
        <nav class="nav-tabs">
            <button class="tab-btn active" onclick="tab('tab-inv', this)">📦 Mag.</button>
            <button class="tab-btn" onclick="tab('tab-pass', this)">🚶 Pass.</button>
            <button class="tab-btn" onclick="tab('tab-pend', this)">🚌 Pend.</button>
            <button class="tab-btn" onclick="tab('tab-rep', this)">📊 Report</button>
        </nav>
        <div class="rect-container">
            <div class="rect" style="border-color:var(--gold)"><b>Merce Reale</b><span id="m-val">0€</span></div>
            <div class="rect" style="border-color:var(--cyan)"><b>Teo Cassa</b><span id="m-cassa">0€</span></div>
            <div class="rect" style="border-color:var(--magenta)"><b>Omaggi</b><span id="m-oma">0</span></div>
            <div class="rect" style="border-color:var(--lime)"><b>Inc. Reale</b><span id="m-inc-reale">0€</span></div>
            <div class="rect" style="border-color:var(--lime); background: rgba(57,255,20,0.1)"><b>Stipendio</b><span id="m-mese-tot">0€</span></div>
            <div class="rect" id="rect-diff-box" style="border-color:var(--txt)"><b>Diff. Merce</b><span id="m-diff">0€</span></div>
        </div>
    </header>

    <div id="tab-inv" class="page active"><div id="schede-magazzino"></div></div>
    <div id="tab-pass" class="page"><div id="list-pass"></div></div>
    <div id="tab-pend" class="page"><div id="list-pend"></div></div>
    
    <div id="tab-rep" class="page">
        <div class="prod-card">
            <div class="q-title">PRIMA QUINDICINA (1-15)</div>
            <div id="grid-q1" class="cal-grid"></div>
            <div class="q-tot-box"><b>TOTALE Q1:</b> <span id="tot-q1" style="color:var(--lime);font-weight:bold">0.00€</span></div>

            <div class="q-title" style="border-color:var(--cyan); color:var(--cyan)">SECONDA QUINDICINA (16-31)</div>
            <div id="grid-q2" class="cal-grid"></div>
            <div class="q-tot-box" style="border-color:var(--cyan)"><b>TOTALE Q2:</b> <span id="tot-q2" style="color:var(--cyan);font-weight:bold">0.00€</span></div>

            <button onclick="chiudiGiorno()" class="btn-action" style="background:var(--lime); color:#000">🏁 CHIUDI E SCARICA VENDUTO</button>
            <button onclick="exportJSON()" class="btn-action" style="background:var(--gold); color:#000">💾 SCARICA BACKUP (JSON)</button>
            <button onclick="document.getElementById('fIn').click()" class="btn-action" style="background:#444; color:#fff">📂 CARICA DATI</button>
            <input type="file" id="fIn" style="display:none" onchange="importJSON(event)">
        </div>
    </div>

<script>
const nomiMagazzino = ["ACQUA","ARACHIDI","BORSE","BORSE GRANDI","BORSE MEDIE","BORSE PICCOLE","BUENO / B READY","CAPPELLI","CARAMELLE / GOM","CHOCO CHIPS","CIALDE","DECA","DIETOR","FITNESS / CEREAL","FONZIES / PATATI","GINSENG","IMPERMEABILI","KINDER CARDS","LATTE","LATTINE","MAGLIE","MIKADO","MUFFIN","NIK NOK","PAVESINI","PERONI","PERONI CAPRI","PRINGLES","PROSECCO / VINO","RED BULL / GATOR","RINGO / OREO / B","RITZ / CIPSTER","SPRITZ","SUCCO","THE / CAMOMILLA","TUC","TWIX / KIT KAT / N"].sort();
const listPendo = [{l:"ACQUA",p:1.0,k:"ACQUA"},{l:"ARACHIDI",p:1.0,k:"ARACHIDI"},{l:"BIRRA",p:1.5,k:"PERONI"},{l:"BISCOTTI",p:1.0,k:"PAVESINI"},{l:"CAFFÈ",p:1.0,k:"CIALDE"},{l:"CAPPUCCINO",p:1.5,k:"LATTE"},{l:"CARAMELLA",p:1.0,k:"CARAMELLE / GOM"},{l:"CHOCO CHIPS",p:2.0,k:"CHOCO CHIPS"},{l:"CIOCCOLATA",p:1.0,k:"TWIX / KIT KAT / N"},{l:"CIPSTER",p:2.5,k:"RITZ / CIPSTER"},{l:"FONZIES",p:1.0,k:"FONZIES / PATATI"},{l:"GATORADE",p:2.5,k:"RED BULL / GATOR"},{l:"GOMME",p:1.0,k:"CARAMELLE / GOM"},{l:"LATTINE",p:1.5,k:"LATTINE"},{l:"MIKADO",p:1.5,k:"MIKADO"},{l:"PATATINE",p:1.0,k:"FONZIES / PATATI"},{l:"PRINGLES",p:2.0,k:"PRINGLES"},{l:"PROSECCO",p:3.0,k:"PROSECCO / VINO"},{l:"RED BULL",p:2.5,k:"RED BULL / GATOR"},{l:"RITZ",p:3.0,k:"RITZ / CIPSTER"},{l:"SUCCHI FRUTTA",p:2.0,k:"SUCCO"},{l:"TUC",p:2.5,k:"TUC"},{l:"VINO",p:3.0,k:"PROSECCO / VINO"}];

let db = JSON.parse(localStorage.getItem('NAVE_V62')) || {
    prodotti: nomiMagazzino.map(n => ({nome:n, qi:0, ca:0, ve:0, og:0, op:0, om:0, re:0, pr:2.50})),
    incassi: Array(31).fill(null),
    stipendioGiaChiuso: 521.65
};

function calcola() {
    let vMerceReale=0, pzOma=0, tIncMese=0, tQ1=0, tQ2=0, tCassaOggi=0, sbilancioMerce=0, ggLavMese=0;
    const oggi = new Date();
    const day = oggi.getDate();

    db.incassi.forEach((val, i) => { 
        if(val !== null) { tIncMese += val; ggLavMese++; if(i < 15) tQ1 += val; else tQ2 += val; }
    });

    db.prodotti.forEach((item, i) => {
        let pRef = listPendo.find(lp => lp.k === item.nome);
        let pPend = pRef ? pRef.p : 1.0;
        tCassaOggi += ((item.og||0) * item.pr) + ((item.op||0) * pPend);
        
        let vTot = (item.ve||0) + (item.og||0) + (item.op||0);
        let teo = (item.qi + item.ca) - vTot - (item.om||0);
        
        vMerceReale += (item.re || 0) * item.pr;
        pzOma += (item.om||0);
        sbilancioMerce += ((item.re || 0) - teo) * item.pr;
        
        // Aggiorna info schede magazzino
        if(document.getElementById(`info-teo-${i}`)) document.getElementById(`info-teo-${i}`).textContent = teo;
        if(document.getElementById(`info-vtot-${i}`)) document.getElementById(`info-vtot-${i}`).textContent = vTot;
        
        // Aggiorna numeretti veloci
        let elOg = document.getElementById(`cog-${i}`); if(elOg) elOg.textContent = item.og || 0;
        let elOp = document.getElementById(`cop-${i}`); if(elOp) elOp.textContent = item.op || 0;
    });

    document.getElementById('m-inc-reale').textContent = (day <= 15 ? tQ1 : tQ2).toFixed(2)+"€";
    document.getElementById('m-cassa').textContent = tCassaOggi.toFixed(2)+"€";
    document.getElementById('m-val').textContent = vMerceReale.toFixed(2)+"€";
    document.getElementById('m-oma').textContent = pzOma;
    document.getElementById('m-diff').textContent = (sbilancioMerce > 0 ? "+" : "") + sbilancioMerce.toFixed(2) + "€";
    document.getElementById('rect-diff-box').style.borderColor = Math.abs(sbilancioMerce) < 0.1 ? '#222' : (sbilancioMerce < 0 ? 'var(--red)' : 'var(--lime)');
    document.getElementById('m-mese-tot').textContent = (db.stipendioGiaChiuso + (tIncMese * 0.05) + (ggLavMese * 26)).toFixed(2)+"€";
    document.getElementById('tot-q1').textContent = tQ1.toFixed(2) + "€";
    document.getElementById('tot-q2').textContent = tQ2.toFixed(2) + "€";
    
    localStorage.setItem('NAVE_V62', JSON.stringify(db));
}

function renderMagazzino() {
    const cont = document.getElementById('schede-magazzino'); cont.innerHTML = '';
    db.prodotti.forEach((item, i) => {
        cont.innerHTML += `<div class="prod-card">
            <div style="display:flex;justify-content:space-between;border-bottom:1px solid #222;padding-bottom:5px;margin-bottom:8px">
                <span style="font-weight:bold;color:var(--cyan)">${item.nome}</span>
                <span style="color:var(--gold)">€ <input type="number" step="0.1" value="${item.pr}" oninput="db.prodotti[${i}].pr=parseFloat(this.value)||0;calcola()" style="width:40px;background:none;border:none;color:var(--gold);border-bottom:1px solid #444"></span>
            </div>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center">
                <div><label style="font-size:9px;color:#777">Iniz</label><input type="number" value="${item.qi}" oninput="db.prodotti[${i}].qi=parseFloat(this.value)||0;calcola()" class="input-box"></div>
                <div><label style="font-size:9px;color:#777">Carico</label><input type="number" value="${item.ca}" oninput="db.prodotti[${i}].ca=parseFloat(this.value)||0;calcola()" class="input-box"></div>
                <div><label style="font-size:9px;color:var(--magenta)">OMA</label><input type="number" value="${item.om}" oninput="db.prodotti[${i}].om=parseFloat(this.value)||0;calcola()" class="input-box" style="border-color:var(--magenta);color:var(--magenta)"></div>
                <div><label style="font-size:9px;color:#777">Vend</label><span id="info-vtot-${i}" style="color:var(--cyan);font-weight:bold">0</span></div>
                <div><label style="font-size:9px;color:#777">Teo</label><span id="info-teo-${i}" style="font-weight:bold">0</span></div>
                <div><label style="font-size:9px;color:#777">Reale</label><input type="number" value="${item.re}" oninput="db.prodotti[${i}].re=parseFloat(this.value)||0;calcola()" class="input-box" style="border-color:var(--lime);color:var(--lime)"></div>
            </div>
        </div>`;
    });
}

function renderVeloci() {
    const p = document.getElementById('list-pass'); p.innerHTML = '';
    const d = document.getElementById('list-pend'); d.innerHTML = '';
    db.prodotti.forEach((item, i) => {
        p.innerHTML += `<div class="prod-card"><div style="display:flex;justify-content:space-between;align-items:center"><span><b>${item.nome}</b></span><div style="display:flex;align-items:center;gap:12px"><button class="btn-qty" style="color:var(--red);border-color:var(--red)" onclick="cambia(${i},-1,'og')">-</button><span id="cog-${i}" style="font-size:22px;width:40px;text-align:center">${item.og || 0}</span><button class="btn-qty" style="color:var(--cyan);border-color:var(--cyan)" onclick="cambia(${i},1,'og')">+</button></div></div></div>`;
        let ref = listPendo.find(lp => lp.k === item.nome);
        if(ref) d.innerHTML += `<div class="prod-card"><div style="display:flex;justify-content:space-between;align-items:center"><span><b>${ref.l}</b></span><div style="display:flex;align-items:center;gap:12px"><button class="btn-qty" style="color:var(--red);border-color:var(--red)" onclick="cambia(${i},-1,'op')">-</button><span id="cop-${i}" style="font-size:22px;width:40px;text-align:center">${item.op || 0}</span><button class="btn-qty" style="color:var(--magenta);border-color:var(--magenta)" onclick="cambia(${i},1,'op')">+</button></div></div></div>`;
    });
}

function renderCalendario() {
    const q1 = document.getElementById('grid-q1'); q1.innerHTML='';
    const q2 = document.getElementById('grid-q2'); q2.innerHTML='';
    for(let i=0; i<31; i++) {
        let isToday = (i + 1 === new Date().getDate()) ? 'today-highlight' : '';
        let html = `<div style="text-align:center; font-size:10px">G${i+1}<input type="number" step="0.01" value="${db.incassi[i]!==null?db.incassi[i]:''}" oninput="db.incassi[${i}]=this.value===''?null:parseFloat(this.value);calcola()" class="input-box ${isToday}" style="color:var(--lime); padding:5px"></div>`;
        if(i < 15) q1.innerHTML += html; else q2.innerHTML += html;
    }
}

function cambia(idx, delta, campo) { db.prodotti[idx][campo] = Math.max(0, (db.prodotti[idx][campo] || 0) + delta); calcola(); }
function tab(id, btn) { document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.getElementById(id).classList.add('active'); document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
function exportJSON() { const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'})); a.download=`backup_nave.json`; a.click(); }
function importJSON(e) { const r=new FileReader(); r.onload=(x)=>{db=JSON.parse(x.target.result); inizializza(); alert("Dati Caricati!");}; r.readAsText(e.target.files[0]); }
function chiudiGiorno() { if(confirm("Scarichi il venduto?")){ db.prodotti.forEach(p=>{p.ve=(p.ve||0)+(p.og||0)+(p.op||0); p.og=0; p.op=0;}); calcola(); alert("Scarico eseguito!"); }}
function inizializza() { renderMagazzino(); renderVeloci(); renderCalendario(); calcola(); }
</script>
</body>
</html>
