<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NAV-PRO V160: FULL CONTROL</title>
    <style>
        :root { --bg: #000; --card: #1c1c1e; --txt: #fff; --cyan: #5ac8fa; --apple-blue: #007aff; --lime: #4cd964; --red: #ff3b30; --gold: #ffcc00; --orange: #ff9500; --purple: #af52de; }
        * { box-sizing: border-box; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--txt); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { background: #000; padding: 10px 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .header b { font-size: 18px; color: var(--lime); }
        .header small { color: #888; text-transform: uppercase; font-size: 10px; }

        .page { display: none; overflow-y: auto; flex-grow: 1; padding-bottom: 100px; }
        .active-page { display: block; }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
        .product-btn { background: var(--card); height: 85px; border-radius: 12px; display: flex; align-items: center; padding: 10px; border: 1px solid #333; }
        .product-btn i { font-size: 24px; margin-right: 10px; width: 30px; text-align: center; }
        .product-btn b { font-size: 10px; text-transform: uppercase; }
        .product-btn .stock { font-size: 13px; font-weight: bold; color: var(--cyan); display: block; }

        .accordion { background: var(--card); border-radius: 12px; margin: 10px; border: 1px solid #333; overflow: hidden; }
        .acc-header { padding: 15px; background: #2c2c2e; display: flex; justify-content: space-between; align-items: center; }
        .acc-body { display: none; padding: 10px; background: #1c1c1e; }
        .edit-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #2c2c2e; }
        .edit-row input { background: #333; border: 1px solid #444; color: var(--cyan); text-align: right; width: 75px; border-radius: 6px; padding: 4px; font-weight: bold; }

        .inv-row { border-bottom: 1px solid #333; display: flex; align-items: center; padding: 12px; background: var(--card); }
        .inv-row div { flex: 1; }
        .inv-row input { width: 80px; background: #000; border: 1px solid var(--apple-blue); color: var(--txt); text-align: center; border-radius: 8px; padding: 10px; font-size: 16px; font-weight: bold; }
        
        .summary-card { background: #1c1c1e; border: 2px solid #333; border-radius: 15px; margin: 15px; padding: 15px; text-align: center; }
        .diff-pos { color: var(--lime); }
        .diff-neg { color: var(--red); }

        .calendar-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 10px; }
        .day-cell { aspect-ratio: 1; background: #2c2c2e; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; border: 1px solid #444; }
        .day-active { border-color: var(--lime); background: #1a2e1a; }

        .footer { position: fixed; bottom: 0; width: 100%; background: #0a0a0a; display: flex; height: 75px; border-top: 1px solid #333; padding-bottom: env(safe-area-inset-bottom); }
        .footer button { flex: 1; background: none; border: none; color: #888; font-size: 9px; font-weight: bold; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
        .footer button.active { color: var(--cyan); }

        .gestionale { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9999; padding: 20px; flex-direction: column; }
    </style>
</head>
<body onload="init()">

<div class="header">
    <div><small>Incasso App</small><br><b id="tot-incasso">0.00€</b></div>
    <div style="text-align:right"><small>Valore Bordo</small><br><b id="header-val-carico" style="color:var(--gold)">0.00€</b></div>
</div>

<div id="page-c" class="page active-page"><div class="grid" id="page-cassa"></div></div>

<div id="page-m" class="page">
    <div style="padding:15px;"><button onclick="chiudiGiornata()" style="width:100%; padding:20px; background:var(--lime); color:#000; border:none; border-radius:12px; font-weight:bold; font-size:16px;">☀️ INIZIO NUOVA GIORNATA</button></div>
    <div id="accordion-list"></div>
    <div style="padding:15px; display: flex; gap: 10px;">
        <button onclick="exportJSON()" style="flex:1; padding:15px; background:var(--apple-blue); border:none; border-radius:10px; color:#fff; font-weight:bold;">📥 SALVA</button>
        <button onclick="document.getElementById('fileInput').click()" style="flex:1; padding:15px; background:var(--orange); border:none; border-radius:10px; color:#000; font-weight:bold;">📤 CARICA</button>
        <input type="file" id="fileInput" style="display:none" onchange="importAndRepair(event)">
    </div>
</div>

<div id="page-i" class="page">
    <div class="summary-card">
        <small style="color:#888">DIFFERENZA TOTALE (Valore Reale vs App)</small>
        <div id="inv-diff" style="font-size:32px; font-weight:bold;">0.00€</div>
        <div id="inv-status" style="font-size:12px; margin-top:5px; color:#ccc;">Verifica in corso...</div>
    </div>
    <div id="inventory-list"></div>
    <div style="padding:20px; text-align:center"><button onclick="clearReali()" style="color:var(--red); background:none; border:1px solid var(--red); padding:10px; border-radius:8px; font-size:11px;">AZZERA CONTEGGI FISICI</button></div>
</div>

<div id="page-h" class="page">
    <div style="padding:10px; color:var(--apple-blue); font-weight:bold; border-bottom:1px solid #333; display:flex; justify-content:space-between;"><span>📅 1-15</span> <b id="tot-q1" style="color:var(--lime)">0.00€</b></div>
    <div id="grid-q1" class="calendar-grid"></div>
    <div style="padding:10px; color:var(--apple-blue); font-weight:bold; border-bottom:1px solid #333; display:flex; justify-content:space-between;"><span>📅 16-31</span> <b id="tot-q2" style="color:var(--lime)">0.00€</b></div>
    <div id="grid-q2" class="calendar-grid"></div>
</div>

<div id="gestionale" class="gestionale">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 id="g-nome" style="color:var(--cyan); margin:0;"></h2>
        <button onclick="closeGest()" style="background:none; border:none; color:var(--red); font-size:40px">&times;</button>
    </div>
    <div style="display:flex; justify-content:center; align-items:center; gap:35px; margin:50px 0;">
        <button onclick="changeQty(-1)" style="width:70px; height:70px; border-radius:35px; background:#333; color:white; font-size:30px; border:none;">-</button>
        <b id="g-qty" style="font-size:60px">1</b>
        <button onclick="changeQty(1)" style="width:70px; height:70px; border-radius:35px; background:#333; color:white; font-size:30px; border:none;">+</button>
    </div>
    <button onclick="conferma('pas')" style="width:100%; padding:22px; border-radius:15px; border:2px solid var(--gold); background:none; color:var(--gold); font-weight:bold; font-size:18px; margin-bottom:15px;">VENDITA PASSEGGERO</button>
    <button onclick="conferma('pen')" style="width:100%; padding:22px; border-radius:15px; border:2px solid var(--apple-blue); background:none; color:var(--apple-blue); font-weight:bold; font-size:18px; margin-bottom:15px;">VENDITA PENDOLARE</button>
    <button onclick="conferma('omaggio')" style="width:100%; padding:15px; border-radius:15px; border:1px solid var(--purple); background:none; color:var(--purple); font-weight:bold;">🎁 OMAGGIO / SCARICA</button>
</div>

<div class="footer">
    <button id="btn-c" class="active" onclick="switchTab('c')">🛒 CASSA</button>
    <button id="btn-m" onclick="switchTab('m')">📊 REPORT</button>
    <button id="btn-i" onclick="switchTab('i')">📦 INVENTARIO</button>
    <button id="btn-h" onclick="switchTab('h')">📅 BUSTE</button>
</div>

<script>
let db = { prodotti: [], history: {} };
let cur = -1, qty = 1;

function init() {
    const saved = localStorage.getItem('NAV_V160');
    if(saved) { db = JSON.parse(saved); repairData(); } 
    else { hardReset(); }
    render();
}

function repairData() {
    db.prodotti.forEach(p => {
        p.q = Number(p.q)||0; p.c = Number(p.c)||0;
        p.vePas = Number(p.vePas)||0; p.vePen = Number(p.vePen)||0;
        p.omaggio = Number(p.omaggio)||0; p.pas = Number(p.pas)||0;
        p.pen = Number(p.pen)||0;
        if(p.reale === undefined) p.reale = null;
    });
}

function hardReset() {
    const master = [
        {n:"ACQUA", i:"💧", q:112, c:0, pas:2.0, pen:1.0}, {n:"ARACHIDI+", i:"🥜", q:11, c:0, pas:2.5, pen:1.0},
        {n:"BORSE G", i:"👜", q:17, c:0, pas:10.0, pen:10.0}, {n:"BORSE M", i:"🛍️", q:3, c:0, pas:7.0, pen:7.0},
        {n:"BUENO/BISC", i:"🍫", q:36, c:0, pas:3.0, pen:1.0}, {n:"CAPPELLI", i:"🧢", q:175, c:0, pas:5.0, pen:5.0},
        {n:"CARAMELLE", i:"🍬", q:119, c:0, pas:2.5, pen:1.0}, {n:"CHOCO CHIPS", i:"🍪", q:10, c:0, pas:3.5, pen:2.0},
        {n:"CIALDE", i:"☕", q:160, c:0, pas:2.0, pen:1.0}, {n:"DECA", i:"☕", q:5, c:0, pas:2.0, pen:1.0},
        {n:"FITNESS", i:"🌾", q:3, c:0, pas:2.5, pen:1.5}, {n:"FONZIES", i:"🍟", q:66, c:0, pas:2.5, pen:1.0},
        {n:"GINSENG", i:"☕", q:10, c:0, pas:2.0, pen:1.0}, {n:"IMPERMEAB", i:"🧥", q:57, c:0, pas:5.0, pen:5.0},
        {n:"KINDER CARDS", i:"🃏", q:12, c:0, pas:3.0, pen:1.5}, {n:"LATTINE", i:"🥤", q:245, c:0, pas:2.5, pen:1.5},
        {n:"M&M", i:"🍫", q:24, c:0, pas:2.5, pen:1.5}, {n:"MAGLIE", i:"👕", q:99, c:0, pas:5.0, pen:5.0},
        {n:"NIK NOK", i:"🥜", q:8, c:0, pas:2.5, pen:1.5}, {n:"PAVESINI", i:"🍪", q:15, c:0, pas:2.5, pen:1.0},
        {n:"PERONI", i:"🍺", q:35, c:0, pas:4.5, pen:1.5}, {n:"PERONI C.", i:"🍋", q:15, c:0, pas:7.5, pen:5.5},
        {n:"PRINGLES", i:"🥔", q:17, c:0, pas:3.5, pen:2.0}, {n:"PROSECCO", i:"🍷", q:30, c:0, pas:6.0, pen:3.0},
        {n:"RED BULL", i:"⚡", q:64, c:0, pas:4.5, pen:2.5}, {n:"RINGO/OREO", i:"🍪", q:64, c:0, pas:2.5, pen:1.0},
        {n:"RITZ", i:"🥨", q:9, c:0, pas:4.5, pen:3.0}, {n:"SPRITZ", i:"🍹", q:10, c:0, pas:8.0, pen:5.0},
        {n:"SUCCO", i:"🧃", q:59, c:0, pas:3.5, pen:2.0}, {n:"THE/CAMOM", i:"🍵", q:125, c:0, pas:2.5, pen:1.5},
        {n:"TUC", i:"🍪", q:7, c:0, pas:3.5, pen:2.5}, {n:"TWIX/KIT KAT", i:"🍫", q:81, c:0, pas:2.5, pen:1.5}
    ];
    db.prodotti = master.map(p => ({...p, vePas:0, vePen:0, omaggio:0, reale:null}));
    db.history = {}; save(); render();
}

function save() { localStorage.setItem('NAV_V160', JSON.stringify(db)); }
function calcF(p) { return p.q + p.c - p.vePas - p.vePen - p.omaggio; }

function render() {
    // 1. CASSA
    document.getElementById('page-cassa').innerHTML = db.prodotti.map((p,i) => `
        <div class="product-btn" onclick="openGest(${i})">
            <i>${p.i}</i><div><b>${p.n}</b><span class="stock">Disp: ${calcF(p)}</span></div>
        </div>`).join('');

    // 2. REPORT & SOMME
    let tInc = 0, tValApp = 0;
    document.getElementById('accordion-list').innerHTML = db.prodotti.map((p,i) => {
        let fine = calcF(p); tInc += (p.vePas * p.pas) + (p.vePen * p.pen); tValApp += fine * p.pas;
        return `<div class="accordion">
            <div class="acc-header" onclick="toggleAcc(${i})"><b>${p.n}</b> <b style="color:var(--gold)">${(fine*p.pas).toFixed(2)}€</b></div>
            <div id="acc-${i}" class="acc-body">
                <div class="edit-row"><span>💰 Prezzo Pas (€):</span> <input type="number" step="0.5" value="${p.pas}" onchange="up(${i},'pas',this.value)"></div>
                <div class="edit-row"><span>🏠 Inizio:</span> <input type="number" value="${p.q}" onchange="up(${i},'q',this.value)"></div>
                <div class="edit-row"><span>🚛 Carico (+):</span> <input type="number" value="${p.c}" onchange="up(${i},'c',this.value)"></div>
                <div class="edit-row"><span>🎟️ Vend. Pas:</span> <input type="number" value="${p.vePas}" onchange="up(${i},'vePas',this.value)"></div>
                <div class="edit-row"><span>🚉 Vend. Pen:</span> <input type="number" value="${p.vePen}" onchange="up(${i},'vePen',this.value)"></div>
                <div class="edit-row"><span>🎁 Omaggi:</span> <input type="number" value="${p.omaggio}" onchange="up(${i},'omaggio',this.value)"></div>
            </div>
        </div>`;
    }).join('');

    // 3. INVENTARIO (CALCOLO REALE)
    let tValReale = 0;
    document.getElementById('inventory-list').innerHTML = db.prodotti.map((p,i) => {
        let fineApp = calcF(p);
        let reale = p.reale !== null ? p.reale : fineApp;
        tValReale += reale * p.pas;
        return `<div class="inv-row">
            <div><b>${p.n}</b><br><small style="color:#888">App: ${fineApp} | Prezzo: ${p.pas}€</small></div>
            <input type="number" value="${p.reale !== null ? p.reale : ''}" placeholder="${fineApp}" onchange="up(${i},'reale',this.value)">
        </div>`;
    }).join('');

    let diffEuri = tValReale - tValApp;
    const dDiv = document.getElementById('inv-diff');
    dDiv.innerText = (diffEuri > 0 ? "+" : "") + diffEuri.toFixed(2) + "€";
    dDiv.className = diffEuri >= 0 ? 'diff-pos' : 'diff-neg';
    document.getElementById('inv-status').innerText = diffEuri === 0 ? "✅ Tutto torna" : (diffEuri > 0 ? "📈 Eccedenza Merce" : "⚠️ Mancano Soldi/Merce");

    // 4. BUSTE & CALENDARI
    let h1="", h2="", t1=0, t2=0;
    for(let d=1; d<=31; d++) {
        let v = Number(db.history[d])||0;
        let cell = `<div onclick="setDay(${d})" class="day-cell ${v>0?'day-active':''}"><b>${d}</b><span>${v>0?v+'€':''}</span></div>`;
        if(d<=15) { h1+=cell; t1+=v; } else { h2+=cell; t2+=v; }
    }
    document.getElementById('grid-q1').innerHTML = h1; document.getElementById('grid-q2').innerHTML = h2;
    document.getElementById('tot-q1').innerText = t1.toFixed(2)+"€"; document.getElementById('tot-q2').innerText = t2.toFixed(2)+"€";
    document.getElementById('tot-incasso').innerText = tInc.toFixed(2) + "€";
    document.getElementById('header-val-carico').innerText = tValApp.toFixed(2) + "€";
    save();
}

function up(i,f,v) { db.prodotti[i][f] = v==='' ? (f==='reale'?null:0) : parseFloat(v); render(); }
function switchTab(t) {
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active-page'));
    document.getElementById('page-'+t).classList.add('active-page');
    document.querySelectorAll('.footer button').forEach(b=>b.classList.remove('active'));
    document.getElementById('btn-'+t).classList.add('active');
}
function openGest(i) { cur=i; qty=1; document.getElementById('g-nome').innerText=db.prodotti[i].n; document.getElementById('g-qty').innerText=qty; document.getElementById('gestionale').style.display='flex'; }
function closeGest() { document.getElementById('gestionale').style.display='none'; }
function changeQty(v) { qty=Math.max(1, qty+v); document.getElementById('g-qty').innerText=qty; }
function conferma(t) { 
    if(t==='pas') db.prodotti[cur].vePas+=qty; 
    else if(t==='pen') db.prodotti[cur].vePen+=qty;
    else db.prodotti[cur].omaggio+=qty;
    closeGest(); render(); 
}
function toggleAcc(i) { let e=document.getElementById('acc-'+i); e.style.display=e.style.display==='block'?'none':'block'; }
function setDay(d) { let r=prompt("Incasso giorno "+d, db.history[d]||""); if(r!==null){ db.history[d]=parseFloat(r.replace(',','.'))||0; render(); }}
function clearReali() { if(confirm("Azzero i conteggi reali?")) { db.prodotti.forEach(p=>p.reale=null); render(); }}
function chiudiGiornata() { if(confirm("Azzerare l'incasso app?")) { db.prodotti.forEach(p=>{ p.q=calcF(p); p.c=0; p.vePas=0; p.vePen=0; p.omaggio=0; p.reale=null; }); render(); }}

function exportJSON() {
    const blob = new Blob([JSON.stringify(db)], {type:'application/json'});
    const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download="NAV_V160_BACKUP.json"; a.click();
}
function importAndRepair(e) {
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=(ev)=>{ try { db=JSON.parse(ev.target.result); repairData(); render(); alert("Backup Caricato con successo!"); } catch(i){ alert("Errore nel file!"); } e.target.value=""; };
    r.readAsText(f);
}
</script>
</body>
</html>
