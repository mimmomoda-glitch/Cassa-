<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NAV-PRO V160 - AMALFI JET</title>
    <style>
        :root { --bg: #000; --card: #1c1c1e; --txt: #fff; --cyan: #5ac8fa; --apple-blue: #007aff; --lime: #4cd964; --red: #ff3b30; --gold: #ffcc00; }
        * { box-sizing: border-box; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--txt); height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: fixed; width: 100%; }
        .header { background: #000; padding: 10px 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; height: 65px; flex-shrink: 0; }
        .boat-box { background: #1c1c1e; padding: 8px 10px; border-radius: 10px; border: 1px solid #333; color: var(--cyan); font-weight: bold; font-size: 14px; border-left: 3px solid var(--cyan); }
        .page { display: none; overflow-y: auto; flex-grow: 1; padding-bottom: 100px; width: 100%; }
        .active-page { display: block; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 15px; }
        .product-btn { background: var(--card); height: 100px; border-radius: 14px; display: flex; align-items: center; padding: 12px; border: 1px solid #333; color: white; cursor: pointer; }
        .product-btn i { font-size: 24px; margin-right: 12px; font-style: normal; }
        .stock { font-size: 20px; font-weight: bold; color: var(--cyan); }
        .footer { position: fixed; bottom: 0; width: 100%; background: #0a0a0a; display: flex; height: 75px; border-top: 1px solid #333; z-index: 1000; }
        .footer button { flex: 1; background: none; border: none; color: #888; font-size: 11px; font-weight: bold; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
        .footer button.active { color: var(--cyan); }
        .btn-action { width: 90%; margin: 10px 5%; padding: 15px; border-radius: 12px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body onload="init()">

<div class="header">
    <div class="boat-box">AMALFI JET</div>
    <div style="text-align:right"><small>INCASSO</small><br><b id="tot-incasso" style="color:var(--lime)">0.00€</b></div>
</div>

<div id="page-c" class="page active-page"><div class="grid" id="grid-cassa"></div></div>

<div id="page-m" class="page">
    <div style="padding:20px; text-align:center;">
        <h3 style="color:var(--cyan)">GESTIONE DATI</h3>
        <button onclick="exportJSON()" class="btn-action" style="background:var(--apple-blue); color:white;">💾 SALVA BACKUP NEI DOWNLOAD</button>
        <button onclick="document.getElementById('file-input').click()" class="btn-action" style="background:var(--card); color:var(--gold); border:1px solid var(--gold);">📂 CARICA BACKUP</button>
        <input type="file" id="file-input" style="display:none" accept=".json" onchange="importJSON(event)">
        <button onclick="resetDati()" class="btn-action" style="background:var(--red); color:white; margin-top:30px;">⚠️ AZZERA TUTTO</button>
    </div>
</div>

<div class="footer">
    <button id="t-c" class="active" onclick="switchTab('c')">🛒 CASSA</button>
    <button id="t-m" onclick="switchTab('m')">📊 MENU</button>
</div>

<script>
// Dati estratti dalla tua foto dell'inventario
const iniziali = [
    {n:"ACQUA", i:"💧", pas:2.0, pen:1.0, q: 229},
    {n:"ARACHIDI", i:"🥜", pas:2.5, pen:1.0, q: 35},
    {n:"BORSE G", i:"👜", pas:10.0, pen:10.0, q: 4},
    {n:"BORSE M", i:"🛍️", pas:7.0, pen:7.0, q: 12},
    {n:"BUENO/BISC", i:"🍫", pas:3.0, pen:1.0, q: 54},
    {n:"CAPPELLI", i:"🧢", pas:5.0, pen:5.0, q: 60},
    {n:"CARAMELLE", i:"🍬", pas:2.5, pen:1.0, q: 105},
    {n:"CIALDE", i:"☕", pas:2.0, pen:1.0, q: 153},
    {n:"FONZIES", i:"🍟", pas:2.5, pen:1.0, q: 85},
    {n:"IMPERMEAB", i:"🧥", pas:5.0, pen:5.0, q: 90},
    {n:"LATTINE", i:"🥤", pas:2.5, pen:1.5, q: 196},
    {n:"MAGLIE", i:"👕", pas:5.0, pen:5.0, q: 43},
    {n:"PERONI", i:"🍺", pas:4.5, pen:1.5, q: 81},
    {n:"PERONI C.", i:"🍋", pas:7.5, pen:5.5, q: 70},
    {n:"PRINGLES", i:"🥔", pas:3.5, pen:2.0, q: 26},
    {n:"PROSECCO", i:"🍷", pas:6.0, pen:3.0, q: 56},
    {n:"RED BULL", i:"⚡", pas:4.5, pen:2.5, q: 36},
    {n:"RINGO/OREO", i:"🍪", pas:2.5, pen:1.0, q: 89},
    {n:"SPRITZ", i:"🍹", pas:8.0, pen:5.0, q: 33},
    {n:"SUCCO", i:"🧃", pas:3.5, pen:2.0, q: 13},
    {n:"THE/CAMOM", i:"🍵", pas:2.5, pen:1.5, q: 65},
    {n:"TWIX/KIT", i:"🍫", pas:2.5, pen:1.5, q: 78}
];

let db = { prodotti: iniziali.map(p => ({...p, ve:0})) };

function init() {
    const saved = localStorage.getItem('NAV_DATA_V2');
    if(saved) db = JSON.parse(saved);
    render();
}

function render() {
    let inc = 0;
    document.getElementById('grid-cassa').innerHTML = db.prodotti.map((p, i) => {
        inc += (p.ve * p.pas);
        return `<div class="product-btn" onclick="venda(${i})"><i>${p.i}</i><div><b>${p.n}</b><br><span class="stock">${p.q - p.ve}</span></div></div>`;
    }).join('');
    document.getElementById('tot-incasso').innerText = inc.toFixed(2) + "€";
    localStorage.setItem('NAV_DATA_V2', JSON.stringify(db));
}

function venda(i) {
    if(db.prodotti[i].q - db.prodotti[i].ve > 0) {
        db.prodotti[i].ve++;
        render();
    }
}

function switchTab(t) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
    document.getElementById('page-'+t).classList.add('active-page');
    document.querySelectorAll('.footer button').forEach(b => b.classList.remove('active'));
    document.getElementById('t-'+t).classList.add('active');
}

function exportJSON() {
    const blob = new Blob([JSON.stringify(db)], { type: "application/json" });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'BACKUP_NAV.json';
    a.click();
}

function importJSON(event) {
    const reader = new FileReader();
    reader.onload = e => { db = JSON.parse(e.target.result); render(); };
    reader.readAsText(event.target.files[0]);
}

function resetDati() {
    if(confirm("Vuoi azzerare le vendite?")) {
        db.prodotti.forEach(p => p.ve = 0);
        render();
    }
}
</script>
</body>
</html>
