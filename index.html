<head>

    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --danger: #e74c3c;
            --success: #27ae60;
            --bg: #f4f7f6;
            --card-bg: #ffffff;

        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); 
            margin: 0; 
            padding: 15px; 
            color: var(--text);

        }

        .container { 
            max-width: 900px; 
            margin: auto;

            display: flex;

            padding: 20px;

</head>
<body>

<div class="container">
    <h1>
        Gestione Incassi & Postazioni
        <button onclick="ripristinaDefault()" style="font-size: 13px; padding: 6px 12px; background: #7f8c8d;">Ripristina Dati Iniziali</button>
    </h1>
    
    <div class="cards">
        <div class="card">
            <h3>Totale Incassato</h3>
            <p id="lblIncasso">€ 0,00</p>
        </div>
        <div class="card">
            <h3>5% sugli Incassi</h3>
            <p id="lbl5p">€ 0,00</p>
        </div>
        <div class="card">
            <h3>Quota Fissa (€26)</h3>
            <p id="lblFissa">€ 0,00</p>
        </div>
        <div class="card highlight">
            <h3>Totale Complessivo</h3>
            <p id="lblTotale">€ 0,00</p>
        </div>
    </div>

    <div class="form-group">
        <h3>Aggiungi Nuova Giornata</h3>
        <div class="field">
            <label>Giorno / Data:</label>
            <input type="text" id="txtGiorno" placeholder="es. 22 Agosto">
        </div>
        
        <div class="field">
            <label>Postazione:</label>
            <input type="text" id="txtPostazione" placeholder="es. Capri Jet o Standard">
        </div>
        
        <div class="field">
            <label>Cash (€):</label>
            <input type="number" id="txtCash" value="0" step="0.01" min="0">
        </div>
        
        <div class="field">
            <label>POS (€):</label>
            <input type="number" id="txtPos" value="0" step="0.01" min="0">
        </div>

        <div class="field" style="justify-content: flex-end; padding-top: 5px;">
            <label class="checkbox-container">
                <input type="checkbox" id="chkFesta">
                <span>Giorno di Festa (Escludi Quota Fissa €26)</span>
            </label>
        </div>
        
        <div class="field" style="justify-content: flex-end;">
            <button class="btn-success" onclick="aggiungiRecord()">Aggiungi Incasso</button>
        </div>
    </div>

    <div class="actions-bar">
        <div style="flex: 1; max-width: 300px;">
            <input type="text" id="txtFiltro" placeholder="Filtra per giorno o postazione..." oninput="aggiornaTabella()">
        </div>
        <div style="font-size: 14px; color: #666;" id="lblContatore">Mostrando 0 record</div>
    </div>

    <div class="table-responsive">
        <table id="tabellaIncassi">
            <thead>
                <tr>
                    <th>Giorno</th>
                    <th>Postazione</th>
                    <th>Cash</th>
                    <th>POS</th>
                    <th>Tot. Incasso</th>
                    <th>5%</th>
                    <th>Fissa</th>
                    <th>Tot. Giorno</th>
                    <th>Azioni</th>
                </tr>
            </thead>
            <tbody>
                <!-- Dati dinamici -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const datiIniziali = [
        { giorno: "1 Agosto", postazione: "Capri Jet", cash: 0, pos: 810, festa: false },
        { giorno: "2 Agosto", postazione: "Capri Jet", cash: 0, pos: 836, festa: false },
        { giorno: "3 Agosto", postazione: "Capri Jet", cash: 0, pos: 1033.50, festa: false },
        { giorno: "4 Agosto", postazione: "Standard", cash: 0, pos: 301, festa: false },
        { giorno: "5 Agosto", postazione: "Standard", cash: 0, pos: 670, festa: false },
        { giorno: "6 Agosto", postazione: "Standard", cash: 0, pos: 863, festa: false },
        { giorno: "7 Agosto", postazione: "Standard", cash: 0, pos: 650, festa: false },
        { giorno: "8 Agosto", postazione: "Standard", cash: 0, pos: 610, festa: false },
        { giorno: "9 Agosto", postazione: "Standard", cash: 0, pos: 235, festa: false },
        { giorno: "10 Agosto", postazione: "Standard", cash: 0, pos: 252, festa: false },
        { giorno: "11 Agosto", postazione: "Standard", cash: 0, pos: 430, festa: false },
        { giorno: "12 Agosto", postazione: "Standard", cash: 0, pos: 400, festa: false },
        { giorno: "13 Agosto", postazione: "Standard", cash: 0, pos: 316, festa: false },
        { giorno: "14 Agosto", postazione: "Capri Jet", cash: 0, pos: 1027, festa: false },
        { giorno: "15 Agosto", postazione: "Standard", cash: 0, pos: 315, festa: false },
        { giorno: "16 Agosto", postazione: "Standard", cash: 0, pos: 320, festa: false },
        { giorno: "17 Agosto", postazione: "Standard", cash: 0, pos: 465, festa: false },
        { giorno: "18 Agosto", postazione: "Standard", cash: 0, pos: 659, festa: false },
        { giorno: "19 Agosto", postazione: "Standard", cash: 0, pos: 995, festa: false },
        { giorno: "20 Agosto", postazione: "Standard", cash: 0, pos: 95, festa: false },
        { giorno: "21 Agosto", postazione: "Festa", cash: 0, pos: 0, festa: true }
    ];

    let dati = [];

    function caricaDati() {
        const salvati = localStorage.getItem('calcolatore_incassi_dati');
        if (salvati) {
            try {
                dati = JSON.parse(salvati);
            } catch(e) {
                dati = [...datiIniziali];
            }
        } else {
            dati = [...datiIniziali];
        }
    }

    function salvaDati() {
        localStorage.setItem('calcolatore_incassi_dati', JSON.stringify(dati));
    }

    function format(val) {
        return '€ ' + val.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function aggiornaTabella() {
        const tbody = document.querySelector('#tabellaIncassi tbody');
        tbody.innerHTML = '';
        
        let filtro = document.getElementById('txtFiltro').value.toLowerCase();
        
        let totIncasso = 0;
        let tot5p = 0;
        let totFissa = 0;
        let recordVisibili = 0;

        dati.forEach((item, index) => {
            let incassoGiorno = (item.cash || 0) + (item.pos || 0);
            let p5 = incassoGiorno * 0.05;
            let fissa = item.festa ? 0 : 26;
            let totGiorno = p5 + fissa;

            // Calcoli globali basati su TUTTI i dati
            totIncasso += incassoGiorno;
            tot5p += p5;
            totFissa += fissa;

            // Filtro ricerca
            let matchGiorno = item.giorno.toLowerCase().includes(filtro);
            let matchPostazione = item.postazione.toLowerCase().includes(filtro);
            if (filtro && !matchGiorno && !matchPostazione) {
                return;
            }

            recordVisibili++;
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.giorno}</td>
                <td>${item.postazione}</td>
                <td>${format(item.cash || 0)}</td>
                <td>${format(item.pos || 0)}</td>
                <td><b>${format(incassoGiorno)}</b></td>
                <td>${format(p5)}</td>
                <td>${format(fissa)}</td>
                <td><b>${format(totGiorno)}</b></td>
                <td><button class="del-btn" onclick="elimina(${index})">Elimina</button></td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('lblIncasso').innerText = format(totIncasso);
        document.getElementById('lbl5p').innerText = format(tot5p);
        document.getElementById('lblFissa').innerText = format(totFissa);
        document.getElementById('lblTotale').innerText = format(tot5p + totFissa);
        document.getElementById('lblContatore').innerText = `Mostrando ${recordVisibili} di ${dati.length} record`;
    }

    function aggiungiRecord() {
        let g = document.getElementById('txtGiorno').value.trim();
        let p = document.getElementById('txtPostazione').value.trim();
        let c = parseFloat(document.getElementById('txtCash').value) || 0;
        let pos = parseFloat(document.getElementById('txtPos').value) || 0;
        let festa = document.getElementById('chkFesta').checked;

        if (!g) {
            alert('Inserisci un giorno o una data.');
            return;
        }
        if (!p) {
            p = 'Standard';
        }

        dati.push({ giorno: g, postazione: p, cash: c, pos: pos, festa: festa });
        salvaDati();
        
        // Reset form
        document.getElementById('txtGiorno').value = '';
        document.getElementById('txtPostazione').value = '';
        document.getElementById('txtCash').value = '0';
        document.getElementById('txtPos').value = '0';
        document.getElementById('chkFesta').checked = false;

        aggiornaTabella();
    }

    function elimina(index) {
        if (confirm('Vuoi davvero eliminare questo record?')) {
            dati.splice(index, 1);
            salvaDati();
            aggiornaTabella();
        }
    }

    function ripristinaDefault() {
        if (confirm('Sei sicuro di voler ripristinare i dati iniziali di agosto? I dati inseriti andranno persi.')) {
            dati = [...datiIniziali];
            salvaDati();
            aggiornaTabella();
        }
    }

    window.onload = function() {
        caricaDati();
        aggiornaTabella();
    };
</script>

</body>
</html>
